<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verificado - CRITERIO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 8px;
        }
        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            margin-left: 4px;
        }
        h1 {
            color: #10b981;
            font-size: 28px;
            margin-bottom: 16px;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .button {
            display: inline-block;
            background: #10b981;
            color: #fff;
            padding: 14px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.2s;
        }
        .button:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✓</div>
        <div class="logo">CRITERIO<span class="dot"></span></div>
        <h1>Email Verificado</h1>
        <p>Tu email ha sido verificado correctamente. Ya puedes usar todas las funciones de CRITERIO.</p>
        <a href="criterio://verified" class="button">Abrir App</a>
    </div>
    <script>
        // Try to open the app automatically
        setTimeout(() => {
            window.location.href = 'criterio://verified';
        }, 2000);
    </script>
</body>
</html>
