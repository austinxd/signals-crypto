  <!-- Navbar -->

    <div class="max-w-6xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="index.html" class="text-xl font-bold tracking-wider">CRITERIO</a>
        <div class="flex items-center gap-8">
          <a href="index.html" class="text-sm text-gray-400 hover:text-white transition">Home</a>
          <a href="privacy.html" class="text-sm text-gray-400 hover:text-white transition">Privacy</a>
          <a href="terms.html" class="text-sm text-gray-400 hover:text-white transition">Terms</a>

      <div class="bg-white/[0.02] border border-white/5 rounded-2xl p-8 space-y-6">

            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            support@criteriotrading.com
          </a>
        </div>

        <div>
          <h2 class="text-lg font-semibold mb-4">Instagram</h2>
          <a href="https://instagram.com/austin.app" target="_blank" rel="noopener" class="inline-flex items-center gap-3 text-xl text-primary hover:text-primary/80 transition">

              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            @austin.app
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    function detectLanguage() {
      const stored = localStorage.getItem('lang');
      if (stored) return stored;
      const browserLang = navigator.language || navigator.userLanguage;
      return browserLang.startsWith('es') ? 'es' : 'en';
    }
    const lang = detectLanguage();
    if (lang === 'es') {
      document.getElementById('page-title').textContent = 'Contacto';
      document.getElementById('page-desc').textContent = 'Para cualquier pregunta o solicitud de soporte, contáctanos:';
    }
  </script>

  <footer class="py-12 px-6 border-t border-white/5">
    <div class="max-w-6xl mx-auto">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="flex items-center gap-8">
          <a href="privacy.html" class="text-sm text-gray-500 hover:text-white transition">Privacy Policy</a>
          <a href="terms.html" class="text-sm text-gray-500 hover:text-white transition">Terms of Service</a>
          <a href="contact.html" class="text-sm text-gray-500 hover:text-white transition">Contact</a>
        </div>
        <p class="text-sm text-gray-600">CRITERIO es una herramienta informativa.</p>
      </div>
    </div>
  </footer>

</html>
