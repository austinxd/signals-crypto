<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact CRITERIO">
  <meta name="theme-color" content="#0f172a">

  <title>Contact - CRITERIO</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#10b981',
            dark: '#0f172a',
            darker: '#020617',
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230f172a' width='100' height='100' rx='20'/><circle cx='50' cy='50' r='8' fill='%2310b981'/></svg>">
</head>
<body class="bg-darker text-gray-100 antialiased">

  <!-- Navbar -->
  <nav class="fixed w-full z-50 bg-darker/80 backdrop-blur-lg border-b border-white/5">
    <div class="max-w-6xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="index.html" class="text-xl font-bold tracking-wider">CRITERIO</a>
        <div class="flex items-center gap-8">
          <a href="index.html" class="text-sm text-gray-400 hover:text-white transition">Home</a>
          <a href="privacy.html" class="text-sm text-gray-400 hover:text-white transition">Privacy</a>
          <a href="terms.html" class="text-sm text-gray-400 hover:text-white transition">Terms</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="pt-32 pb-24 px-6">
    <div class="max-w-2xl mx-auto">
      <h1 class="text-4xl font-bold mb-12" id="page-title">Contact</h1>

      <p class="text-gray-400 mb-8" id="page-desc">For any questions or support requests, please contact us:</p>

      <div class="bg-white/[0.02] border border-white/5 rounded-2xl p-8">
        <h2 class="text-lg font-semibold mb-4">Email</h2>
        <a href="mailto:support@criteriotrading.com" class="inline-flex items-center gap-3 text-xl text-primary hover:text-primary/80 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          support@criteriotrading.com
        </a>
      </div>
    </div>
  </main>

  <script>
    function detectLanguage() {
      const stored = localStorage.getItem('lang');
      if (stored) return stored;
      const browserLang = navigator.language || navigator.userLanguage;
      return browserLang.startsWith('es') ? 'es' : 'en';
    }
    const lang = detectLanguage();
    if (lang === 'es') {
      document.getElementById('page-title').textContent = 'Contacto';
      document.getElementById('page-desc').textContent = 'Para cualquier pregunta o solicitud de soporte, contáctanos:';
    }
  </script>

  <footer class="py-12 px-6 border-t border-white/5">
    <div class="max-w-6xl mx-auto">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="flex items-center gap-8">
          <a href="privacy.html" class="text-sm text-gray-500 hover:text-white transition">Privacy Policy</a>
          <a href="terms.html" class="text-sm text-gray-500 hover:text-white transition">Terms of Service</a>
          <a href="contact.html" class="text-sm text-gray-500 hover:text-white transition">Contact</a>
        </div>
        <p class="text-sm text-gray-600">CRITERIO es una herramienta informativa.</p>
      </div>
    </div>
  </footer>

</body>
</html>
